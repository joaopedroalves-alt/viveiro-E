<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viveiro — berçário de ideias</title>
<link rel="stylesheet" href="src/estilo.css">
</head>

<body>

<header>
  <div class="marca">
    <h1>Viveiro</h1>
    <span class="lema">onde as ideias crescem antes de virar projeto</span>
  </div>

  <div class="sessao">
    <label for="quem">navegando como</label>
    <select id="quem"></select>
  </div>
</header>

<nav class="abas">
  <button id="aba-mural" class="aba ativa">Mural</button>
  <button id="aba-grupos" class="aba">Grupos</button>
</nav>

<main>

  <!-- MURAL -->
  <section id="mural">

    <!-- PUBLICAR IDEIA -->
    <div class="publicar">

      <h2>Publique uma ideia</h2>

      <form id="form-ideia">

        <input
          id="titulo-ideia"
          type="text"
          placeholder="Título da ideia"
          autocomplete="off">

        <textarea
          id="resumo-ideia"
          placeholder="Descreva sua ideia..."></textarea>

        <input
          id="tags-ideia"
          type="text"
          placeholder="Tags (ex: tecnologia, educação)"
          autocomplete="off">

        <div class="publicar-footer">

          <p id="erro-ideia"></p>

          <button
            type="submit"
            class="publicar-btn">
            Publicar
          </button>

        </div>

      </form>

    </div>


    <h2>Mural de ideias</h2>

    <div class="barra">

      <label for="busca" class="escondido">
        Buscar ideias
      </label>

      <input
        id="busca"
        type="search"
        placeholder="buscar por título ou resumo..."
        autocomplete="off">

      <span id="contagem" class="contagem"></span>

    </div>

    <p id="filtro-ativo" class="filtro-ativo"></p>

    <div id="cartoes" class="cartoes"></div>

  </section>


  <!-- PÁGINA DA PESSOA -->
  <section id="pessoa" class="escondido">

    <button id="voltar-mural" class="voltar">
      ← voltar ao mural
    </button>

    <div id="perfil-pessoa" class="perfil"></div>

    <h2>Ideias publicadas</h2>

    <div id="ideias-pessoa" class="cartoes"></div>

  </section>


  <!-- GRUPOS -->
  <section id="grupos" class="escondido">

    <h2>Grupos do Viveiro</h2>

    <ul id="lista-grupos" class="lista-grupos"></ul>

  </section>

</main>

<footer>
  <span>Viveiro — versão 0.1 (MVP)</span>
  <span id="base" class="base"></span>
</footer>

<script src="dados/dados_E.js"></script>
<script src="src/app.js"></script>

</body>
</html>
