<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Viveiro — berçário de ideias</title>

  <link rel="stylesheet" href="src/estilo.css">
</head>

<body>

<header>

  <div class="marca">
    <h1>Viveiro</h1>

    <span class="lema">
      onde as ideias crescem antes de virar projeto
    </span>
  </div>

  <div class="sessao">

    <label for="quem">
      navegando como
    </label>

    <select id="quem"></select>

  </div>

</header>


<nav class="abas" aria-label="Navegação principal">

  <button
    id="aba-mural"
    class="aba ativa"
    type="button">
    Mural
  </button>

  <button
    id="aba-grupos"
    class="aba"
    type="button">
    Grupos
  </button>

</nav>


<main>

  <!-- MURAL -->

  <section id="mural">

    <!-- V-03 — PUBLICAR UMA IDEIA -->

    <div class="publicar">

      <h2>Plante uma ideia</h2>

      <form id="form-ideia">

        <div class="campo">

          <label for="titulo-ideia">
            Título
          </label>

          <input
            id="titulo-ideia"
            type="text"
            placeholder="Dê um nome para sua ideia..."
            autocomplete="off">

        </div>


        <div class="campo">

          <label for="resumo-ideia">
            Resumo
          </label>

          <textarea
            id="resumo-ideia"
            placeholder="Conte um pouco sobre sua ideia..."></textarea>

        </div>


        <div class="campo">

          <label for="tags-ideia">
            Tags
          </label>

          <input
            id="tags-ideia"
            type="text"
            placeholder="Ex.: tecnologia, educação, sustentabilidade..."
            autocomplete="off">

        </div>


        <p
          id="erro-ideia"
          class="erro-ideia">
        </p>


        <button
          type="submit"
          class="publicar-btn">
          Publicar ideia
        </button>

      </form>

    </div>


    <h2>Mural de ideias</h2>


    <div class="barra">

      <label
        for="busca"
        class="escondido">
        Buscar ideias
      </label>

      <input
        id="busca"
        type="search"
        placeholder="Buscar por título ou resumo..."
        autocomplete="off">

      <span
        id="contagem"
        class="contagem">
      </span>

    </div>


    <p
      id="filtro-ativo"
      class="filtro-ativo">
    </p>


    <div
      id="cartoes"
      class="cartoes">
    </div>

  </section>


  <!-- PÁGINA DA PESSOA -->

  <section
    id="pessoa"
    class="escondido">

    <button
      id="voltar-mural"
      class="voltar"
      type="button">
      ← Voltar ao mural
    </button>


    <div
      id="perfil-pessoa"
      class="perfil">
    </div>


    <h2>Ideias publicadas</h2>


    <div
      id="ideias-pessoa"
      class="cartoes">
    </div>

  </section>


  <!-- GRUPOS -->

  <section
    id="grupos"
    class="escondido">

    <h2>Grupos do Viveiro</h2>

    <ul
      id="lista-grupos"
      class="lista-grupos">
    </ul>

  </section>

</main>


<footer>

  <span>
    Viveiro — versão 0.1 (MVP)
  </span>

  <span
    id="base"
    class="base">
  </span>

</footer>


<script src="dados/dados_E.js"></script>
<script src="src/app.js"></script>

</body>
</html>
